version: 2

models:

  - name: fct_trips
    description: >
      Fato de corridas de táxi (camada silver — antes vivia na gold; movido
      pra cá porque a modelagem dimensional passou a ser tarefa da silver).
      Grão: 1 linha = 1 corrida. Carga incremental por pickup_at, com merge
      por trip_id. Contém apenas chaves estrangeiras e métricas — os
      atributos descritivos vêm das dimensões, via join na camada de consumo.
      Toda dimensão relacionada ao fato tem um teste de relationships aqui,
      garantindo que toda FK do fato aponte pra uma linha existente na dimensão.
    columns:
      - name: trip_id
        description: "Chave do fato. Surrogate key herdada da camada silver (stg_taxi_trips)."
        tests:
          - not_null
          - unique

      - name: pickup_date_id
        description: "FK para dim_date. Data do início da corrida (pickup_at truncado para dia)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_id

      - name: pickup_location_id
        description: "FK para dim_zone. Zona de embarque."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id

      - name: dropoff_location_id
        description: "FK para dim_zone. Zona de desembarque."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id

      - name: payment_type_id
        description: "FK para dim_payment_type. Forma de pagamento da corrida."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id

      - name: vendor_id
        description: "Dimensão degenerada: fornecedor do sistema (TPEP provider) que registrou a corrida."

      - name: rate_code_id
        description: "Dimensão degenerada: código da tarifa aplicada (1=padrão, 2=JFK, 3=Newark, 4=Nassau/Westchester, 5=negociada, 6=grupo)."

      - name: store_and_fwd_flag
        description: "Dimensão degenerada: Y/N, indica se o registro ficou guardado no veículo antes de ser transmitido."

      - name: pickup_at
        description: "Timestamp de início da corrida. Mantido no grão fino para análise por hora do dia."
        tests:
          - not_null

      - name: dropoff_at
        description: "Timestamp de fim da corrida."
        tests:
          - not_null

      - name: passenger_count
        description: "Número de passageiros informado pelo motorista."

      - name: trip_distance_miles
        description: "Distância da corrida em milhas, medida pelo taxímetro."

      - name: fare_amount
        description: "Tarifa base calculada pelo taxímetro."

      - name: extra_amount
        description: "Sobretaxas diversas (horário de pico, período noturno)."

      - name: mta_tax_amount
        description: "Taxa fixa da MTA."

      - name: tip_amount
        description: "Gorjeta. Só é registrada em pagamento com cartão — em dinheiro vem zerada."

      - name: tolls_amount
        description: "Pedágios pagos na corrida."

      - name: improvement_surcharge_amount
        description: "Sobretaxa fixa de melhoria."

      - name: congestion_surcharge_amount
        description: "Sobretaxa de congestionamento (áreas específicas de Manhattan)."

      - name: total_amount
        description: "Valor total cobrado ao passageiro (não inclui gorjeta em dinheiro)."
        tests:
          - not_null

      - name: trip_duration_minutes
        description: "Métrica derivada: duração da corrida em minutos (dropoff_at - pickup_at)."

      - name: amount_per_mile
        description: "Métrica derivada: total_amount dividido pela distância. Nulo quando a distância é zero."

      - name: tip_percentage
        description: >
          Métrica derivada: gorjeta como % da tarifa base. Nulo quando fare_amount
          é zero. Só é analiticamente válida para payment_type_id = 1 (cartão);
          gorjeta em dinheiro não é capturada pelo dataset.
