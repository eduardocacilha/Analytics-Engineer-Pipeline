version: 2

models:

  - name: agg_corridas_por_mes
    description: >
      Métrica de negócio (camada gold): total de corridas por mês.
      Grão: 1 linha por mês (ano_mes). Consome fct_trips, que agora vive
      na camada silver.
    columns:
      - name: ano_mes
        description: "Chave da métrica. Mês de referência no formato yyyy-MM."
        tests:
          - not_null
          - unique
      - name: mes_referencia
        description: "Primeiro dia do mês de referência (usado para ordenação/plotagem no BI)."
      - name: total_corridas
        description: "Quantidade de corridas com pickup nesse mês."
      - name: ticket_medio
        description: "Valor médio de total_amount das corridas do mês."
      - name: receita_total
        description: "Soma de total_amount das corridas do mês."

  - name: agg_corridas_por_vendor
    description: >
      Métrica de negócio (camada gold): total de corridas por fornecedor
      (vendor_id — o dataset da TLC não tem ID de motorista, só o provedor
      TPEP). Grão: 1 linha por vendor. Consome fct_trips, que agora vive
      na camada silver.
    columns:
      - name: vendor_id
        description: "Chave da métrica. Fornecedor do sistema TPEP que registrou a corrida."
        tests:
          - not_null
          - unique
      - name: total_corridas
        description: "Quantidade de corridas registradas por esse vendor."
      - name: ticket_medio
        description: "Valor médio de total_amount das corridas desse vendor."
      - name: receita_total
        description: "Soma de total_amount das corridas desse vendor."
