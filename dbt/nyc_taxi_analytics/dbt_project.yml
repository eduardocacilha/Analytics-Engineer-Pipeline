name: 'nyc_taxi_analytics'
version: '1.0.0'
config-version: 2

profile: 'nyc_taxi_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_taxi_analytics:
    staging:
      +materialized: view
      +schema: silver
    marts:
      +materialized: table
      +schema: gold

# Seeds sao dado de referencia bruto (lookups da TLC carregados como vieram),
# entao moram na bronze, ao lado da source nyc_taxi_trips. As dimensoes
# conformadas que nascem deles (dim_zone, dim_payment_type) ficam na silver.
seeds:
  nyc_taxi_analytics:
    +schema: bronze
